
[functions.livekit-token]
enabled = true
verify_jwt = false
import_map = "./functions/livekit-token/deno.json"
# Uncomment to specify a custom file path to the entrypoint.
# Supported file extensions are: .ts, .js, .mjs, .jsx, .tsx
entrypoint = "./functions/livekit-token/index.ts"
# Specifies static files to be bundled with the function. Supports glob patterns.
# For example, if you want to serve static HTML pages in your function:
# static_files = [ "./functions/livekit-token/*.html" ]

[functions.livekit-participants]
enabled = true
verify_jwt = false
import_map = "./functions/livekit-participants/deno.json"
# Uncomment to specify a custom file path to the entrypoint.
# Supported file extensions are: .ts, .js, .mjs, .jsx, .tsx
entrypoint = "./functions/livekit-participants/index.ts"
# Specifies static files to be bundled with the function. Supports glob patterns.
# For example, if you want to serve static HTML pages in your function:
# static_files = [ "./functions/livekit-participants/*.html" ]

[functions.livekit-moderate]
enabled = true
verify_jwt = false
import_map = "./functions/livekit-moderate/deno.json"
entrypoint = "./functions/livekit-moderate/index.ts"

# Payments. Each function checks the caller itself; the webhook is called by
# Stripe and is authenticated by Stripe's signature instead of a JWT.
[functions.stripe-connect]
enabled = true
verify_jwt = false
import_map = "./functions/stripe-connect/deno.json"
entrypoint = "./functions/stripe-connect/index.ts"

[functions.stripe-checkout]
enabled = true
verify_jwt = false
import_map = "./functions/stripe-checkout/deno.json"
entrypoint = "./functions/stripe-checkout/index.ts"

[functions.stripe-webhook]
enabled = true
verify_jwt = false
import_map = "./functions/stripe-webhook/deno.json"
entrypoint = "./functions/stripe-webhook/index.ts"

# Called by the notifications trigger through pg_net; checks the database
# itself instead of a JWT (see the function header).
[functions.send-push]
enabled = true
verify_jwt = false
import_map = "./functions/send-push/deno.json"
entrypoint = "./functions/send-push/index.ts"

[functions.livekit-record]
enabled = true
verify_jwt = false
import_map = "./functions/livekit-record/deno.json"
entrypoint = "./functions/livekit-record/index.ts"

# Nightly story clean-up, called by pg_cron (src/sql/034_story_cleanup.sql).
[functions.cleanup-stories]
enabled = true
verify_jwt = false
import_map = "./functions/cleanup-stories/deno.json"
entrypoint = "./functions/cleanup-stories/index.ts"
